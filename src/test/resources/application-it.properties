# Perfil de integración (sin Docker): PostgreSQL embebido + Kafka embebido + identity falso en proceso.
# Puertos, tópicos y URLs se inyectan desde AbstractCustomerIT.
spring.flyway.enabled=true
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

spring.kafka.consumer.group-id=customer-it
spring.kafka.consumer.auto-offset-reset=earliest
customer.outbox.poll-interval-ms=200

# Timeouts cortos y circuito que no se abre durante la suite (su lógica ya está en las pruebas unitarias)
customer.identity.connect-timeout=1s
customer.identity.read-timeout=1s
customer.identity.circuit-breaker.sliding-window-size=100
customer.identity.circuit-breaker.minimum-calls=100