spring.application.name=customer-service
server.port=${SERVER_PORT:8085}

# Base de datos
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/customer_db}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:1234}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# JWT: se valida con la llave pública de identity
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=${IDENTITY_JWKS_URI:http://localhost:8081/.well-known/jwks.json}

# Kafka
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.acks=all
spring.kafka.producer.properties.enable.idempotence=true
spring.kafka.producer.properties.max.block.ms=5000
spring.kafka.consumer.group-id=customer-service
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.auto-offset-reset=earliest

customer.kafka.customer-events-topic=customer-events
customer.kafka.payment-events-topic=payment-events
customer.outbox.poll-interval-ms=1000

# Comunicación con identity (clave compartida: la misma INTERNAL_API_KEY de identity)
customer.identity.base-url=${IDENTITY_URL:http://localhost:8081}
customer.identity.api-key=${INTERNAL_API_KEY:bgrYnhNTQaQVy1sxCjpRorn09NdsI2qFCnMCFVvhJHg=}


# Configuración de timeouts y circuit breaker para la comunicación con identity
customer.identity.connect-timeout=2s
customer.identity.read-timeout=5s
customer.identity.circuit-breaker.sliding-window-size=10
customer.identity.circuit-breaker.minimum-calls=5
customer.identity.circuit-breaker.failure-rate-threshold=50
customer.identity.circuit-breaker.wait-in-open-state=15s


management.endpoints.web.exposure.include=health,info