# ================== SERVER PORT ==================
server.port=${SERVER_PORT}

# ==================== Base de datos ====================
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.jpa.show-sql=false

# ==================== JWT (llave pública de identity) ====================
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=${IDENTITY_JWKS_URI}

# ==================== Kafka ====================
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS}

# ==================== Comunicación con identity ====================
customer.identity.base-url=${IDENTITY_URL}
customer.identity.api-key=${INTERNAL_API_KEY}

# ==================== Logging ====================
logging.level.root=INFO